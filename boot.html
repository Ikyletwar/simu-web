<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMU</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink-hi: #0d0d0d;
    --ink-mid: #2b2b2b;
    --ink-lo: #434343;
    --ink-gold: #1a1a1a;
    --ink-muted: #8c8c8c;
    --gold: 26, 26, 26;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);

    --wordmark-size: clamp(96px, 24vmin, 280px);
    --gap-subtitle:  clamp(24px, 2.6vw, 36px);
    --gap-loader:    clamp(48px, 5vw, 64px);
    --sub-letter-final: 0.42em;
    --ambient-scale-x: 1;
    --ambient-scale-y: 1;
  }

  @media (orientation: portrait) {
    :root {
      --wordmark-size: clamp(56px, min(22vmin, 17vw), 180px);
      --gap-subtitle:  clamp(20px, 3.2vh, 32px);
      --gap-loader:    clamp(56px, 9vh, 96px);
      --sub-letter-final: 0.38em;
      --ambient-scale-x: 0.7;
      --ambient-scale-y: 1.3;
    }
  }

  @media (orientation: landscape) and (max-height: 520px) {
    :root {
      --wordmark-size: clamp(56px, min(26vmin, 12vw), 140px);
      --gap-subtitle:  clamp(12px, 2vh, 20px);
      --gap-loader:    clamp(24px, 4vh, 40px);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Jost', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
    cursor: pointer;
  }

  /* ═══ FONT GATING ═══════════════════════════════ */
  html:not(.fonts-ready) .lockup,
  html:not(.fonts-ready) .backglow { visibility: hidden; }

  html.fonts-ready .lockup {
    visibility: visible;
    animation: lockupIn 0.22s ease-out;
  }
  @keyframes lockupIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ═══ AMBIENT ═══════════════════════════════════ */
  .ambient {
    position: fixed; inset: -25%;
    transform: scale(var(--ambient-scale-x), var(--ambient-scale-y));
    transform-origin: 50% 50%;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(var(--gold), 0.14) 0%,
      rgba(var(--gold), 0.05) 30%,
      transparent 62%
    );
    opacity: 0;
    filter: blur(30px);
    animation:
      ambientIn 3s var(--ease) 0.2s forwards,
      ambientBreathe 9s ease-in-out 3.2s infinite;
    pointer-events: none;
  }
  @keyframes ambientIn { to { opacity: 1; } }
  @keyframes ambientBreathe {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(26, 26, 26, 0.05) 100%);
    pointer-events: none;
  }

  .stage {
    position: fixed; inset: 0;
    display: grid;
    place-items: center;
    padding:
      max(4vh, env(safe-area-inset-top))
      max(6vw, env(safe-area-inset-right))
      max(4vh, env(safe-area-inset-bottom))
      max(6vw, env(safe-area-inset-left));
    z-index: 1;
  }

  /* ═══ BACKGLOW ═════════════════════════════════ */
  .backglow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    width: min(90vw, 780px);
    aspect-ratio: 1.5;
    background: radial-gradient(
      ellipse at 50% 55%,
      rgba(var(--gold), 0.18) 0%,
      rgba(var(--gold), 0.06) 32%,
      transparent 68%
    );
    filter: blur(32px);
    pointer-events: none;
    opacity: 0;
    animation: backglowIn 2.6s var(--ease) 1.0s forwards;
  }
  @keyframes backglowIn { to { opacity: 1; } }

  .lockup {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    z-index: 1;
  }

  /* ═══ WORDMARK ═══════════════════════════════
     Grid 4 kolom fixed — keempat slot huruf sudah
     ter-reserve dari awal, jadi layout tetap center
     meskipun huruf belum muncul. */
  .wordmark {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: max-content;
    justify-items: center;
    align-items: end;
    font-family: 'Bodoni Moda', 'Didot', 'Times New Roman', serif;
    font-size: var(--wordmark-size);
    font-weight: 400;
    font-optical-sizing: auto;
    line-height: 0.92;
    user-select: none;
    padding: 0.06em 0 0.14em;
  }

  /* ═══ LETTER ═════════════════════════════════
     Slot tetap ada (grid), tapi semua layer di dalamnya
     hidden sampai animasi per huruf dimulai. */
  .letter {
    display: inline-grid;
    place-items: center;
    position: relative;
  }

  .letter > .layer {
    grid-area: 1 / 1;
    display: block;
    line-height: inherit;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    /* KUNCI: bukan cuma opacity rendah, tapi benar-benar
       tidak di-paint sampai animasi per huruf dimulai. */
    visibility: hidden;
  }

  /* ── OUTLINE — muncul per huruf, pop cepat ── */
  .outline {
    background-color: rgba(13, 13, 13, 0.32);
    opacity: 0;
    animation:
      outlineIn  0.22s ease var(--outline-delay) forwards,
      outlineOut 0.45s ease var(--fade-delay)    forwards;
  }
  @media (max-width: 768px), (hover: none) {
    .outline { background-color: rgba(13, 13, 13, 0.36); }
  }

  @keyframes outlineIn {
    from { visibility: visible; opacity: 0; transform: scale(0.985); }
    to   { visibility: visible; opacity: 1; transform: scale(1); }
  }
  @keyframes outlineOut {
    from { visibility: visible; opacity: 1; }
    to   { visibility: visible; opacity: 0; }
  }

  /* ── FILL — clip-path sweep per huruf ── */
  .fill {
    background-image: linear-gradient(
      180deg,
      var(--ink-hi)   0%,
      var(--ink-mid)  38%,
      var(--ink-lo)   78%,
      var(--ink-gold) 100%
    );
    background-size: 100% 100%;
    background-repeat: no-repeat;
    clip-path: var(--clip-from);
    animation: fillSweep var(--fill-dur) var(--ease) var(--fill-delay) forwards;
  }
  @keyframes fillSweep {
    from { visibility: visible; }
    to   { visibility: visible; clip-path: inset(0 0 0 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .letter > *, .subtitle, .loader, .loader svg, .status-dots span {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  /* ═══ SUBTITLE ═══════════════════════════════ */
  .subtitle-wrap {
    width: 100%;
    margin-top: var(--gap-subtitle);
    display: grid;
    justify-items: center;
    overflow: hidden;
  }
  .subtitle {
    font-family: 'Jost', system-ui, sans-serif;
    font-size: clamp(9px, 0.85vw, 11px);
    font-weight: 400;
    text-transform: uppercase;
    color: var(--ink-muted);
    white-space: nowrap;
    user-select: none;
    opacity: 0;
    letter-spacing: 1.1em;
    padding-left: 1.1em;
    transform: translateY(6px);
    animation:
      subtitleAppear  1.8s var(--ease) 4.6s forwards,
      subtitleCondense 1.8s var(--ease) 4.6s forwards;
  }
  .subtitle .sep {
    display: inline-block;
    margin: 0 0.7em;
    color: rgba(var(--gold), 0.55);
  }
  @keyframes subtitleAppear {
    0%   { opacity: 0; transform: translateY(6px); }
    22%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes subtitleCondense {
    0%   { letter-spacing: 1.1em; padding-left: 1.1em; }
    100% { letter-spacing: var(--sub-letter-final); padding-left: var(--sub-letter-final); }
  }
  @media (orientation: portrait) and (max-width: 400px) {
    .subtitle {
      font-size: 9px;
      white-space: normal;
      text-align: center;
      line-height: 2;
      max-width: 88vw;
    }
  }

  /* ═══ LOADER ═════════════════════════════════ */
  .loader {
    position: relative;
    margin-top: var(--gap-loader);
    opacity: 0;
    transform: translateY(10px) scale(0.94);
    animation: loaderIn 1.2s var(--ease) 6.5s forwards;
  }
  @keyframes loaderIn {
    0%   { opacity: 0; transform: translateY(10px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0)    scale(1); }
  }
  .loader::before {
    content: '';
    position: absolute;
    inset: -24px;
    background: radial-gradient(circle, rgba(var(--gold), 0.15), transparent 70%);
    filter: blur(8px);
    pointer-events: none;
  }
  .loader svg {
    position: relative;
    display: block;
    width: 26px;
    height: 26px;
    overflow: visible;
    transform-origin: 50% 50%;
    animation: spin 1.15s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .track { stroke: rgba(var(--gold), 0.08); }

  /* ═══ STATUS ═════════════════════════════════ */
  .status-dots {
    margin-top: 18px;
    font-family: 'Jost', system-ui, sans-serif;
    font-size: 9px;
    font-weight: 300;
    letter-spacing: 0.75em;
    padding-left: 0.75em;
    color: rgba(140, 140, 140, 0.55);
    text-transform: uppercase;
    opacity: 0;
    animation: statusIn 1.4s var(--ease) 7.3s forwards;
  }
  .status-dots span {
    display: inline-block;
    animation: dotPulse 3s ease-in-out infinite;
  }
  .status-dots span:nth-child(2) { animation-delay: 0.3s; }
  .status-dots span:nth-child(3) { animation-delay: 0.6s; }
  .status-dots span:nth-child(4) { animation-delay: 0.9s; }
  @keyframes statusIn { to { opacity: 1; } }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.22; }
    50%      { opacity: 1; }
  }

  /* ═══ DEBUG ═══════════════════════════════════ */
  html.debug .stage              { outline: 1px dashed #ff3b30; }
  html.debug .backglow           { outline: 1px dashed #af52de; }
  html.debug .lockup             { outline: 1px dashed #34c759; }
  html.debug .wordmark           { outline: 1px dashed #0a84ff; }
  html.debug .subtitle-wrap      { outline: 1px dashed #ff2d92; }
  html.debug .letter             { outline: 1px dotted #ffcc00; }
  html.debug .letter > .outline  { outline: 1px dotted #ff9500; }
  html.debug .letter > .fill     { outline: 1px dotted #ffffff; }

  html.debug body::after {
    content: '';
    position: fixed;
    left: 50%; top: 0; bottom: 0;
    width: 1px;
    background: rgba(255, 59, 48, 0.85);
    z-index: 99998;
    pointer-events: none;
    transform: translateX(-0.5px);
  }

  .debug-panel {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: max(8px, env(safe-area-inset-left));
    background: rgba(0, 0, 0, 0.88);
    color: #d1ffd1;
    font: 10px/1.5 ui-monospace, 'SF Mono', Menlo, monospace;
    padding: 8px 10px;
    border-radius: 6px;
    z-index: 99999;
    display: none;
    white-space: pre;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.15);
    max-width: 78vw;
  }
  html.debug .debug-panel { display: block; }
</style>
</head>
<body>
  <div class="ambient"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div class="backglow" aria-hidden="true"></div>

    <div class="lockup">
      <h1 class="wordmark" aria-label="SIMU">
        <!-- Setiap huruf punya window waktu sendiri:
             outline-delay → outline muncul (pop)
             fill-delay    → fill mulai sweep
             fade-delay    → outline hilang setelah fill -->
        <span class="letter" aria-hidden="true" style="
          --outline-delay: 0.50s;
          --fill-delay:    0.72s;
          --fill-dur:      0.70s;
          --fade-delay:    1.45s;
          --clip-from: inset(0 100% 100% 0);
        ">
          <span class="layer outline">S</span>
          <span class="layer fill">S</span>
        </span>

        <span class="letter" aria-hidden="true" style="
          --outline-delay: 1.50s;
          --fill-delay:    1.72s;
          --fill-dur:      0.40s;
          --fade-delay:    2.15s;
          --clip-from: inset(0 0 100% 0);
        ">
          <span class="layer outline">I</span>
          <span class="layer fill">I</span>
        </span>

        <span class="letter" aria-hidden="true" style="
          --outline-delay: 2.20s;
          --fill-delay:    2.42s;
          --fill-dur:      0.85s;
          --fade-delay:    3.30s;
          --clip-from: inset(0 50% 0 50%);
        ">
          <span class="layer outline">M</span>
          <span class="layer fill">M</span>
        </span>

        <span class="letter" aria-hidden="true" style="
          --outline-delay: 3.35s;
          --fill-delay:    3.57s;
          --fill-dur:      0.75s;
          --fade-delay:    4.35s;
          --clip-from: inset(100% 0 0 0);
        ">
          <span class="layer outline">U</span>
          <span class="layer fill">U</span>
        </span>
      </h1>

      <div class="subtitle-wrap">
        <p class="subtitle">
          Sistem<span class="sep">·</span>Informasi<span class="sep">·</span>Manajemen<span class="sep">·</span>Ujian
        </p>
      </div>

      <div class="loader" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <defs>
            <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#434343" stop-opacity="0"/>
              <stop offset="35%"  stop-color="#2b2b2b" stop-opacity="1"/>
              <stop offset="100%" stop-color="#0d0d0d" stop-opacity="1"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="20" cy="20" r="17" fill="none" stroke-width="1"/>
          <circle class="arc"   cx="20" cy="20" r="17" fill="none" stroke-width="1.25"
                  stroke-linecap="round" stroke-dasharray="27 80"
                  stroke="url(#arcGrad)"/>
        </svg>
      </div>

      <div class="status-dots">
        <span>L</span><span>O</span><span>A</span><span>D</span>
      </div>
    </div>
  </div>

  <div class="debug-panel" id="debugPanel"></div>

<script>
  (function () {
    // ── Font gating ──────────────────────────────
    let revealed = false;
    const reveal = () => {
      if (revealed) return;
      revealed = true;
      document.documentElement.classList.add('fonts-ready');
    };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reveal);
      setTimeout(reveal, 2500);
    } else {
      reveal();
    }

    // ── Debug mode ───────────────────────────────
    const html = document.documentElement;
    const panel = document.getElementById('debugPanel');
    let debugOn = false;
    let debugRAF = null;
    let tapCount = 0;
    let tapTimer = null;
    let driftMax = 0;

    function toggleDebug() {
      debugOn = !debugOn;
      html.classList.toggle('debug', debugOn);
      if (debugOn) {
        driftMax = 0;
        tickDebug();
      } else if (debugRAF) {
        cancelAnimationFrame(debugRAF);
        debugRAF = null;
        panel.textContent = '';
      }
    }

    function tickDebug() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cx = vw / 2;

      const rows = [];
      rows.push(`viewport   ${vw}×${vh}`);
      rows.push(`center x   ${cx.toFixed(1)}`);
      rows.push(`drift max  ${driftMax.toFixed(2)}px`);
      rows.push('');

      const sels = ['.stage', '.backglow', '.lockup', '.wordmark', '.subtitle-wrap'];
      sels.forEach((sel) => {
        const el = document.querySelector(sel);
        if (!el) return;
        const r = el.getBoundingClientRect();
        const off = (r.left + r.width / 2) - cx;
        if (sel !== '.stage' && sel !== '.backglow') {
          driftMax = Math.max(driftMax, Math.abs(off));
        }
        const flag = Math.abs(off) > 0.5 ? ' ⚠' : ' ✓';
        rows.push(`${sel.padEnd(15)} Δx ${off >= 0 ? '+' : ''}${off.toFixed(2)}${flag}`);
      });

      rows.push('');
      const letters = document.querySelectorAll('.letter');
      letters.forEach((el, i) => {
        const r = el.getBoundingClientRect();
        const off = (r.left + r.width / 2) - cx;
        const ch = el.querySelector('.outline').textContent;
        rows.push(`letter[${i}] ${ch}  Δx ${off >= 0 ? '+' : ''}${off.toFixed(2)}`);
      });

      if (letters.length >= 2) {
        const r0 = letters[0].getBoundingClientRect();
        const rN = letters[letters.length - 1].getBoundingClientRect();
        const sym = (r0.left - cx) + (rN.right - cx);
        rows.push('');
        rows.push(`simetri    ${sym >= 0 ? '+' : ''}${sym.toFixed(2)} ${Math.abs(sym) > 0.5 ? '⚠' : '✓'}`);
      }

      panel.textContent = rows.join('\n');
      debugRAF = requestAnimationFrame(tickDebug);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') toggleDebug();
    });

    document.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (t.clientX < 80 && t.clientY < 80) {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 600);
        if (tapCount >= 3) { tapCount = 0; toggleDebug(); }
      }
    }, { passive: true });

    document.body.addEventListener('click', (e) => {
      if (debugOn) return;
      if (e.clientX < 80 && e.clientY < 80) return;
      document.querySelectorAll(
        '.letter, .letter > *, .subtitle, .loader, .loader svg, .status-dots'
      ).forEach((el) => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    });
  })();

  // ── SIMU: set flag lalu redirect ke login ──────────
  (function () {
    var redirecting = false;
    function goLogin() {
      if (redirecting) return;
      redirecting = true;
      sessionStorage.setItem('simu_booted', '1');
      document.body.style.transition = 'opacity 0.4s ease';
      document.body.style.opacity = '0';
      setTimeout(function () { window.location.replace('index.html'); }, 420);
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.debug-panel')) return;
      goLogin();
    });
    setTimeout(goLogin, 8800);
  })();
</script>
</body>
</html>
