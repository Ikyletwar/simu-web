<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMU</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #f5f5f5;
    --fg-dim: rgba(245,245,245,.45);
    --bg: #0a0a0a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: grid;
    place-items: center;
  }

  .scene {
    text-align: center;
    padding: 24px;
  }

  .title {
    display: flex;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: clamp(3.5rem, 14vw + 1vh, 10rem);
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--fg);
  }

  .title .char {
    display: inline-block;
    will-change: transform, opacity;
  }

  .subtitle {
    margin-top: clamp(1.5rem, 3vw, 2.2rem);
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(0.72rem, 0.9vw + 0.2vh, 0.9rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--fg-dim);
    padding-left: 0.32em;
  }

  .loader {
    margin-top: clamp(2rem, 4vw, 2.8rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .spinner {
    width: clamp(28px, 2.4vw + 0.8vh, 36px);
    height: clamp(28px, 2.4vw + 0.8vh, 36px);
    border: 1.5px solid rgba(255,255,255,.10);
    border-top-color: rgba(255,255,255,.85);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-label {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(0.58rem, 0.7vw, 0.68rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--fg-dim);
    padding-left: 0.4em;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="scene">
    <h1 class="title" aria-label="SIMU">
      <span class="char">S</span><span class="char">I</span><span class="char">M</span><span class="char">U</span>
    </h1>

    <p class="subtitle">Sistem Informasi Manajemen Ujian</p>

    <div class="loader">
      <div class="spinner"></div>
      <p class="loading-label">Memuat</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
  (function () {
    'use strict';

    var redirecting = false;
    var targetUrl = 'index.html';

    function goNext() {
      if (redirecting) return;
      redirecting = true;

      /* PENTING: set flag supaya index.html tidak redirect balik
         ke boot.html (yang bikin loop tanpa henti). */
      try {
        sessionStorage.setItem('simu_booted', '1');
      } catch (e) {
        /* abaikan -- private mode */
      }

      document.body.style.transition = 'opacity .35s ease';
      document.body.style.opacity = '0';
      setTimeout(function () {
        window.location.replace(targetUrl);
      }, 380);
    }

    document.addEventListener('click', goNext);
    if ('ontouchstart' in window) {
      document.addEventListener('touchstart', goNext, { passive: true });
    }
    setTimeout(goNext, 3200);

    /* Animasi GSAP (opsional). Konten default visible. */
    if (typeof window.gsap === 'undefined') return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    var chars = gsap.utils.toArray('.title .char');

    gsap.set(chars, { opacity: 0, y: 10 });
    gsap.set('.subtitle', { opacity: 0 });
    gsap.set('.loader', { opacity: 0 });

    var tl = gsap.timeline({ delay: 0.15 });

    tl.to(chars, {
      opacity: 1,
      y: 0,
      duration: 0.7,
      ease: 'power2.out',
      stagger: 0.10
    });

    tl.to('.subtitle', {
      opacity: 1,
      duration: 0.6,
      ease: 'power2.out'
    }, '-=0.20');

    tl.to('.loader', {
      opacity: 1,
      duration: 0.5,
      ease: 'power2.out'
    }, '-=0.10');

  })();
  </script>
</body>
</html>
