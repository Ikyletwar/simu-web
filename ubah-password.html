<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMU - Ubah Password</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-container">
    <div class="card login-card">
      <div class="login-header">
        <img src="assets/logo.svg" alt="SIMU" class="login-logo">
        <h1>Ubah Password</h1>
        <p class="hint" id="pageHint">Ganti password Anda</p>
      </div>
      <form id="gantiForm" class="login-form">
        <div class="form-group">
          <label class="label" for="passLama">Password Lama</label>
          <input type="password" id="passLama" class="input" placeholder="Password saat ini" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label class="label" for="passBaru">Password Baru</label>
          <input type="password" id="passBaru" class="input" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="label" for="passUlang">Ulangi Password Baru</label>
          <input type="password" id="passUlang" class="input" placeholder="Ketik ulang password baru" required minlength="6" autocomplete="new-password">
        </div>
        <div id="errorMessage" class="error-message hidden"></div>
        <button type="submit" class="btn btn-primary w-full" id="submitBtn">
          <span id="btnText">Simpan Password</span>
          <span id="btnLoader" class="hidden"><span class="spinner-small"></span></span>
        </button>
      </form>
      <div class="login-footer">
        <a href="#" id="backLink" class="link-secondary">Kembali ke Dashboard</a>
      </div>
    </div>
  </div>

  <div id="snackbar" class="snackbar"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const profile = await guard(['admin', 'guru']);
      if (!profile) return;

      const home = 'dashboard-admin.html';
      document.getElementById('backLink').href = home;
      document.getElementById('pageHint').textContent =
        'Ganti password akun ' + (profile.nama || 'Admin');

      document.getElementById('gantiForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errorEl = document.getElementById('errorMessage');
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');

        const lama = document.getElementById('passLama').value;
        const baru = document.getElementById('passBaru').value;
        const ulang = document.getElementById('passUlang').value;

        if (!lama || !baru || !ulang) {
          showFormError(errorEl, 'Harap isi semua kolom.');
          return;
        }
        if (baru.length < 6) {
          showFormError(errorEl, 'Password baru minimal 6 karakter.');
          return;
        }
        if (baru !== ulang) {
          showFormError(errorEl, 'Password baru dan ulangannya tidak sama.');
          return;
        }
        clearFormError(errorEl);

        // Verifikasi password lama dulu
        btn.disabled = true;
        btnText.textContent = 'Memproses...';
        btnLoader.classList.remove('hidden');

        try {
          const email = profile.email;

          if (!email) {
            const { data: p } = await supabaseClient.from('users').select('email').eq('id', profile.id).maybeSingle();
            if (!p || !p.email) throw new Error('Email akun tidak ditemukan.');
            await verifikasiLama(p.email, lama);
          } else {
            await verifikasiLama(email, lama);
          }

          const { error: updErr } = await supabaseClient.auth.updateUser({ password: baru });
          if (updErr) throw new Error(updErr.message);

          showSnackbar('Password berhasil diubah.', 'success');
          btnText.textContent = 'Berhasil';
          setTimeout(function () {
            window.location.href = home;
          }, 1000);
        } catch (err) {
          showFormError(errorEl, err.message || 'Gagal mengubah password.');
          showSnackbar(err.message || 'Gagal mengubah password.', 'error');
          btn.disabled = false;
          btnText.textContent = 'Simpan Password';
          btnLoader.classList.add('hidden');
        }
      });
    });

    async function verifikasiLama(email, lama) {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: lama
      });
      if (error) throw new Error('Password lama salah.');
    }
  </script>
</body>
</html>
