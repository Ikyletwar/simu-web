<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMU - Login Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-container">
    <div class="card login-card">
      <div class="login-header">
        <img src="assets/logo.svg" alt="SIMU" class="login-logo">
        <h1>Login Admin</h1>
        <p class="hint">Masukkan email atau username dan password Anda</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label class="label" for="email">Email / Username</label>
          <div class="input-icon-wrapper">
            <span class="input-icon" id="mailIcon"><i data-lucide="mail"></i></span>
            <input type="text" id="email" class="input input-icon-field" placeholder="admin@sekolah.sch.id atau username" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label class="label" for="password">Password</label>
          <div class="input-icon-wrapper" id="passwordWrapper">
            <span class="input-icon" id="lockIcon"><i data-lucide="lock"></i></span>
            <input type="password" id="password" class="input input-icon-field input-password" placeholder="Masukkan password" required>
            <button type="button" class="input-toggle" id="togglePassword" aria-label="Lihat password" aria-pressed="false" title="Lihat password">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
                <path d="m2 2 20 20"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="errorMessage" class="error-message hidden"></div>
        <button type="submit" class="btn btn-primary w-full" id="submitBtn">
          <span id="btnText">Masuk sebagai Admin</span>
          <span id="btnLoader" class="hidden"><span class="spinner-small"></span></span>
        </button>
        <button type="button" class="btn btn-secondary w-full mt-8" id="quickAdminBtn">
          <i data-lucide="zap"></i>
          <span>Login Cepat Admin (testing)</span>
        </button>
        <p class="hint text-center mt-8">Akun test: <b>admin@simu.local</b> / <b>admin1234</b></p>
      </form>
      <div class="login-footer">
        <a href="index.html" class="link-secondary">Kembali ke Login Siswa</a>
      </div>
    </div>
  </div>

  <div id="snackbar" class="snackbar"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    lucide.createIcons();

    // Login cepat (testing): isi otomatis akun admin dummy lalu submit
    document.getElementById('quickAdminBtn').addEventListener('click', function () {
      document.getElementById('email').value = 'admin@simu.local';
      document.getElementById('password').value = 'admin1234';
      document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));
    });
  </script>
</body>
</html>
